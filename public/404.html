<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <meta name="description" content="Page not found">
  <style>
    /* Design Tokens - Inlined for production */
    :root {
      /* Colors */
      --color-primary: #2196f3;
      --color-primary-dark: #1976d2;
      --color-background: #ffffff;
      --color-text-primary: #212121;
      --color-text-secondary: #757575;
      
      /* Typography */
      --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      --font-size-md: 1.125rem;
      --font-size-xl: 1.5rem;
      --font-size-2xl: 2rem;
      --font-size-4xl: 3rem;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      --line-height-relaxed: 1.75;
      
      /* Spacing */
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      
      /* Breakpoints */
      --breakpoint-mobile: 768px;
    }
  </style>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-background);
      font-family: var(--font-family-base);
    }

    .error-container {
      text-align: center;
      padding: var(--spacing-xl);
      max-width: 600px;
    }

    .error-code {
      font-size: calc(var(--font-size-4xl) * 2);  /* 6rem - Extra large for impact */
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
      margin: 0;
      line-height: 1;
    }

    .error-title {
      font-size: var(--font-size-2xl);  /* 2rem - 32px */
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      margin: var(--spacing-md) 0;
    }

    .error-message {
      font-size: var(--font-size-md);  /* 1.125rem - 18px */
      color: var(--color-text-secondary);
      margin: var(--spacing-md) 0 var(--spacing-xl);
      line-height: var(--line-height-relaxed);
    }

    .error-actions {
      display: flex;
      gap: var(--spacing-md);
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-md) var(--spacing-xl);
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-family-base);
      color: white;
      background: var(--color-primary);
      border: 2px solid var(--color-primary);
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 150px;
    }

    .btn:hover {
      background: var(--color-primary-dark);
      border-color: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .error-illustration {
      font-size: calc(var(--font-size-4xl) * 2.67);  /* ~8rem - Large emoji */
      margin-bottom: var(--spacing-lg);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(calc(var(--spacing-md) * -1));  /* -20px using token */
      }
    }

    @media (max-width: var(--breakpoint-mobile)) {
      .error-code {
        font-size: calc(var(--font-size-4xl) * 1.33);  /* ~4rem on mobile */
      }

      .error-title {
        font-size: var(--font-size-xl);  /* 1.5rem - 24px on mobile */
      }

      .error-illustration {
        font-size: calc(var(--font-size-4xl) * 1.67);  /* ~5rem on mobile */
      }

      .error-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-illustration">🔍</div>
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Page Not Found</h2>
    <p class="error-message">
      Oops! The page you're looking for doesn't exist. 
      It might have been moved or deleted.
    </p>
    
    <div class="error-actions">
      <a href="/hello-world-webcomponents/" class="btn">
        Go Home
      </a>
    </div>
  </div>
</body>
</html>
